name: E2E browser matrix

# Full browser matrix, run only when explicitly requested. WebKit needs
# Ubuntu system libraries unavailable on e.g. Arch hosts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser E2E (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      MIX_ENV: test
      E2E_BROWSER: ${{ matrix.engine }}
      E2E_VISUAL_TOLERANCE: "0.05"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-e2e-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Install E2E npm packages
        working-directory: test/e2e
        run: npm ci --no-audit --no-fund

      - name: Install ${{ matrix.engine }}
        working-directory: test/e2e
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser E2E suite
        run: mix test.e2e

      - name: Upload screenshots and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.engine }}
          path: |
            test/e2e/screenshots/
            test/e2e/artifacts/
          if-no-files-found: ignore

  # Soft performance tripwire: run the load benchmark and keep the output
  # as an artifact for manual comparison against bench/BASELINE.md. No
  # failure threshold (log-only) — see PLAN.md Phase 8.
  bench:
    name: Load benchmark (log-only)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29"

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.20.2-29-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-1.20.2-29-

      - name: Install dependencies
        run: mix deps.get

      - name: Run load benchmark
        run: mix run bench/canvas_bench.exs | tee bench-output.txt

      - name: Upload benchmark output
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: bench-output.txt
